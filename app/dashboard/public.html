<body class="public">

<!-- Read-only inspection shell. No login, no Basic auth, no CSRF header: every request it makes is a GET against
     /api/public/..., which is GET-only and rebuilt from allow-lists. Nothing on this page can change anything. -->
<header id="top">
  <div class="top-row">
    <div class="brand"><span class="brand-mark"></span>PaperLab</div>
    <span class="pill ghost">READ-ONLY INSPECTION</span>
    <span id="status-light" class="pill ghost" title="paper execution · stream · live market data">PAPER ● CONNECTING</span>
    <span class="spacer"></span>
    <span id="pub-updated" class="sub">loading&hellip;</span>
    <a class="btn ghost" href="/public/competition/bots?p=video&bot=BTC-4H-BREAKOUT">Bitcoin breakout</a>
    <a class="btn ghost" href="/lab" title="Overview, bots and programs in the newer layout">Lab dashboard</a>
  </div>
  <nav id="nav" class="mainnav" role="tablist" aria-label="sections"></nav>
</header>

<main id="main">
  <section data-panel="home" class="panel">
    <div id="home-grid" class="grid"><div class="card"><p class="sub">loading the arena&hellip;</p></div></div>
  </section>
  <section data-panel="scout" class="panel" hidden>
    <div id="scout-grid" class="grid"><div class="card"><p class="sub">loading the scout&hellip;</p></div></div>
  </section>
  <section data-panel="system" class="panel" hidden>
    <div id="system-grid" class="grid"><div class="card"><p class="sub">loading the system status&hellip;</p></div></div>
    <div class="grid"><div class="card"><h2>research history</h2>
      <p class="sub">V1&ndash;V5 are frozen research programs. Their full results are in the
        <a href="/public/competition/report">server-rendered report</a> and in <a href="/public/inspection.json">inspection.json</a>.</p></div></div>
  </section>
</main>

<div id="toasts"></div>
